{% extends "base.html" %}

{% block title %}
Quiz Result
{% endblock %}

{% block content %}

<h1>Quiz Completed</h1>

<hr>

<h2>{{ attempt.quiz.title }}</h2>

<br>

<p>
    <strong>Score:</strong>
    {{ attempt.score }}
</p>

<p>
    <strong>Percentage:</strong>
    {{ "%.2f"|format(attempt.percentage) }}%
</p>

<br>

<p>

    <a href="{{ url_for('student.quizzes') }}">
        Back to Available Quizzes
    </a>

</p>

{% endblock %}
