{% extends "base.html" %}

{% block title %}
Quiz Result
{% endblock %}

{% block content %}

<h1>Quiz Result</h1>

<p>
    <strong>Score:</strong>
    {{ attempt.score }}
</p>

<p>
    <strong>Percentage:</strong>
    {{ "%.2f"|format(attempt.percentage) }}%
</p>

<br>

<a href="{{ url_for('student.review_attempt', attempt_id=attempt.id) }}">
    Review Answers
</a>

<br><br>

<a href="{{ url_for('student.quizzes') }}">
    Back to Available Quizzes
</a>

{% endblock %}
